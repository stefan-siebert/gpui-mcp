[package]
name = "gpui-mcp-inspector"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
uuid = { version = "1.11", features = ["v4"] }

[[bin]]
name = "gpui-mcp-server"
path = "src/main.rs"

[lib]
name = "gpui_mcp_protocol"
path = "src/lib.rs"

[[example]]
name = "gpui_integration"
path = "examples/gpui_integration.rs"
